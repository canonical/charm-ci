name: Publish opcli to PyPI

# Builds and publishes the `opcli` package to PyPI using PyPI Trusted
# Publishing (OIDC) -- no API token is stored in this repository.
#
# Trigger: `workflow_dispatch` only. Publishing is deliberately NOT tied to
# `release: published` so that a public GitHub Release can never go out
# ahead of (or independent of) a successful PyPI publish, and so a failed
# publish can always be safely retried by re-running this workflow (the
# `skip-existing` option below makes re-runs idempotent even if a previous
# attempt partially succeeded). A maintainer runs this manually, from the
# tag/ref they intend to publish, after cutting the GitHub Release.
on:
  workflow_dispatch:

# Least-privilege default; `id-token: write` is granted only on the publish
# job, which needs it for PyPI's OIDC trusted-publishing exchange.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install --classic astral-uv

      - name: Check pyproject.toml version matches the ref being published
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::This workflow must be run against a version tag" \
              "(e.g. 'v1.0.0'), not '${GITHUB_REF_NAME}'. Select the tag to" \
              "publish when running this workflow via workflow_dispatch."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${tag}" != "${pkg_version}" ]; then
            echo "::error::Tag 'v${tag}' does not match pyproject.toml version '${pkg_version}'." \
              "Bump pyproject.toml's [project].version to match before tagging/releasing."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi-release
      url: https://pypi.org/p/opcli
    # Required for PyPI Trusted Publishing (OIDC); no secrets.PYPI_API_TOKEN
    # is used or needed.
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to v1.14.2 (release/v1 branch head as of this writing) per
        # this repo's supply-chain convention of SHA-pinning actions that
        # run with elevated permissions (here: id-token: write for OIDC).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          # Makes re-running this workflow after a partial/failed publish
          # safe: if a file was already uploaded (e.g. sdist succeeded but
          # the wheel upload then failed), PyPI's "already exists" error for
          # that specific file is treated as success instead of failing the
          # whole job.
          skip-existing: true
