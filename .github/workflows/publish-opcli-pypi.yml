name: Publish opcli to PyPI

# Publishes `opcli` to PyPI via Trusted Publishing (OIDC) -- no API token
# stored in this repo. Run manually (workflow_dispatch) against a release
# tag, after the GitHub Release is already cut.
#
# Known limitation: a failed publish here leaves a public GitHub Release
# with no matching PyPI package until re-run; acceptable for this manual,
# single-maintainer flow.
on:
  workflow_dispatch:

# Least-privilege default; `id-token: write` is granted only on the publish
# job, which needs it for PyPI's OIDC trusted-publishing exchange.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install --classic astral-uv

      - name: Check pyproject.toml version matches the ref being published
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::This workflow must be run against a version tag" \
              "(e.g. 'v1.0.0'), not '${GITHUB_REF_NAME}'. Select the tag to" \
              "publish when running this workflow via workflow_dispatch."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${tag}" != "${pkg_version}" ]; then
            echo "::error::Tag 'v${tag}' does not match pyproject.toml version '${pkg_version}'." \
              "Bump pyproject.toml's [project].version to match before tagging/releasing."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the built wheel
        # Catches a broken build before it's ever published (PyPI never
        # allows re-uploading a different file under the same name).
        run: |
          uv venv /tmp/opcli-smoke-test
          # shellcheck disable=SC1091
          source /tmp/opcli-smoke-test/bin/activate
          wheel="$(ls dist/*.whl)"
          uv pip install "${wheel}[cli]"
          opcli --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi-release
      url: https://pypi.org/p/charm-opcli
    # Required for PyPI Trusted Publishing (OIDC); no secrets.PYPI_API_TOKEN
    # is used or needed.
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # SHA-pinned per this repo's convention for actions with elevated
        # permissions (id-token: write here).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          # Safe retry after a partial upload failure. Does NOT allow
          # replacing an already-published (broken) file -- PyPI filenames
          # are immutable, so that requires a new version instead.
          skip-existing: true
