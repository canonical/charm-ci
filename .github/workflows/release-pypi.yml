name: Release opcli to PyPI

# Builds and publishes the `opcli` package to PyPI using PyPI Trusted
# Publishing (OIDC) -- no API token is stored in this repository.
#
# Triggers:
# - `release: published`: fires automatically when a maintainer publishes a
#   GitHub Release (the existing tag -> Release flow described in
#   AGENTS.md's "Git workflow" section). This is the normal release path.
# - `workflow_dispatch`: lets a maintainer re-run/test the build job (e.g.
#   after a failed publish) without cutting a new Release. The publish job
#   still only runs for `release` events -- see its `if:` condition.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege default; `id-token: write` is granted only on the publish
# job, which needs it for PyPI's OIDC trusted-publishing exchange.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install --classic astral-uv

      - name: Check pyproject.toml version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${tag}" != "${pkg_version}" ]; then
            echo "::error::Release tag 'v${tag}' does not match pyproject.toml version '${pkg_version}'." \
              "Bump pyproject.toml's [project].version to match before tagging/releasing."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    environment:
      name: pypi-release
      url: https://pypi.org/p/opcli
    # Required for PyPI Trusted Publishing (OIDC); no secrets.PYPI_API_TOKEN
    # is used or needed.
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
